services:
  lan-video-player:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/lan-video-player:latest
    container_name: lan-video-player
    restart: unless-stopped
    read_only: true
    # Mapeia o usuário do host (ex.: cristiano) para o usuário 10001 do container no Podman rootless,
    # permitindo leitura de /home/cristiano e /mnt em modo somente-leitura sem alterar permissões nem rótulos SELinux do host
    userns_mode: "keep-id:uid=10001,gid=10001"
    security_opt:
      - label=disable
      - no-new-privileges:true
    ports:
      - "${LVP_PORT:-8090}:8080"
    environment:
      LVP_ADDR: "0.0.0.0:8080"
      LVP_BROWSE_BASE: "/media"
      LVP_CONFIG_FILE: "/config/library.json"
      LVP_CACHE_DIR: "/tmp/lan-video-player-thumbs"
      LVP_MEDIA_DIRS: "${LVP_MEDIA_DIRS:-}"
    volumes:
      # Pastas do host montadas estritamente em modo somente-leitura (:ro) dentro de /media
      - "${LVP_HOST_HOME:-/home/cristiano}:/media/cristiano:ro"
      - "${LVP_HOST_MNT:-/mnt}:/media/mnt:ro"
      # Volume dedicado (fora das pastas de mídia) para persistir as pastas selecionadas na Web UI (library.json)
      - lvp_config:/config:Z
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

volumes:
  lvp_config:
