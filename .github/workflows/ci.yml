name: CI & Auto PR

on:
  push:
    branches:
      - develop
      - main
      - 'phase/**'
      - 'feature/**'
      - 'hotfix/**'
      - 'hotfix*'
      - '[0-9][0-9][0-9]-*'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Automated Tests with Race Detector & Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Static Single Binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/lan-video-player ./cmd/lan-video-player

      - name: Verify Binary Startup Flag (--version)
        run: ./bin/lan-video-player --version

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 1

  # Job dedicado do SonarQube rodando em container no CI (mesmo padrão do projeto contas)
  sonarqube:
    name: SonarQube Scan & Quality Gate
    needs: [build-and-test]
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:10.5-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        options: >-
          --health-cmd "curl -s -f http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Run SonarQube Scan & Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://localhost:9000"
        run: |
          # Se SONAR_TOKEN não estiver configurado nos secrets do repositório, autentica no container local efêmero
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "Gerando token temporário no SonarQube local do CI..."
            # Altera senha padrão admin/admin ou gera token direto no container de CI
            SONAR_TOKEN=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" -d "name=ci-token-${GITHUB_RUN_ID}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          fi

          docker run --rm \
            --network host \
            -e SONAR_HOST_URL="http://localhost:9000" \
            -e SONAR_TOKEN="${SONAR_TOKEN}" \
            -v "${GITHUB_WORKSPACE}:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.qualitygate.wait=true

  # Abre PR de branch de fase/feature/spec → develop (ou main se develop não existir)
  auto-pr-to-develop:
    name: Open PR to develop
    needs: [build-and-test, sonarqube]
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/develop' &&
      !startsWith(github.ref, 'refs/heads/hotfix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check or create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TARGET_BASE="develop"
          if ! git show-ref --verify --quiet refs/remotes/origin/develop; then
            TARGET_BASE="main"
          fi

          COMMITS_AHEAD=$(git log "origin/${TARGET_BASE}..HEAD" --oneline 2>/dev/null || true)
          if [ -z "$COMMITS_AHEAD" ]; then
            echo "Nenhum commit novo entre $BRANCH e $TARGET_BASE. PR não necessário."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --base "$TARGET_BASE" --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull Request #$EXISTING_PR já existe de $BRANCH para $TARGET_BASE."
          else
            echo "Criando Pull Request de $BRANCH para $TARGET_BASE..."
            if ! gh pr create \
              --base "$TARGET_BASE" \
              --head "$BRANCH" \
              --title "feat: $BRANCH" \
              --body $'### Pull Request Automatizado\n\nEste PR foi aberto automaticamente pela esteira de CI após a conclusão bem-sucedida do build, `go vet`, testes com `-race` e SonarQube no branch `'"$BRANCH"$'`.\n\n#### Verificações Realizadas\n- [x] Compilação de binário único estático (`CGO_ENABLED=0`)\n- [x] Análise estática com `go vet ./...`\n- [x] Execução de testes unitários e de integração com `go test -race ./...`\n- [x] Quality Gate do SonarQube aprovado'; then
              echo "::warning::Não foi possível criar o PR automaticamente via GITHUB_TOKEN. Ative 'Allow GitHub Actions to create and approve pull requests' em https://github.com/${GITHUB_REPOSITORY}/settings/actions ou abra manualmente em https://github.com/${GITHUB_REPOSITORY}/compare/${TARGET_BASE}...${BRANCH}?expand=1"
            fi
          fi

  # Abre PR de develop ou hotfix* → main
  auto-pr-to-main:
    name: Open PR to main
    needs: [build-and-test, sonarqube]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/hotfix'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check or create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          COMMITS_AHEAD=$(git log origin/main..HEAD --oneline 2>/dev/null || git log main..HEAD --oneline 2>/dev/null || true)
          if [ -z "$COMMITS_AHEAD" ]; then
            echo "Nenhum commit novo entre $BRANCH e main. PR não necessário."
            exit 0
          fi
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull Request #$EXISTING_PR já existe de $BRANCH para main."
          else
            if [[ "$BRANCH" == hotfix* ]]; then
              PR_TITLE="hotfix: $BRANCH"
              PR_BODY=$'### Pull Request Automatizado (Hotfix → main)\n\nEste PR de **hotfix** foi aberto automaticamente pela esteira de CI diretamente para a `main` após aprovação no build, testes e SonarQube no branch `'"$BRANCH"$'`.'
            else
              PR_TITLE="chore: merge develop into main"
              PR_BODY=$'### Pull Request Automatizado\n\nEste PR foi aberto automaticamente pela esteira de CI após a conclusão bem-sucedida do build, testes e SonarQube no branch `develop`.'
            fi
            if ! gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"; then
              echo "::warning::Não foi possível criar o PR automaticamente via GITHUB_TOKEN. Ative 'Allow GitHub Actions to create and approve pull requests' em https://github.com/${GITHUB_REPOSITORY}/settings/actions ou abra manualmente em https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            fi
          fi

  # Cria Release no GitHub quando código for mergeado na branch main
  release-on-main:
    name: Create GitHub Release
    needs: [build-and-test, sonarqube]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Determine version tag, build release binary and create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_VERSION=$(grep -m1 'const AppVersion =' internal/config/config.go | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$PROJECT_VERSION" ]; then
            PROJECT_VERSION="0.1.0"
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMIT_LOGS=$(git log "${LAST_TAG}..HEAD" --oneline)
          else
            COMMIT_LOGS=$(git log -n 20 --oneline)
          fi

          IS_MAJOR=false
          if echo "$COMMIT_LOGS" | grep -Ei "(\b(feat|fix|refactor|perf|chore)\!:|BREAKING[ -]CHANGE|\[major\]|breaking)" >/dev/null; then
            IS_MAJOR=true
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$PROJECT_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}

          if [ "$IS_MAJOR" = true ]; then
            NEW_MAJOR=$((MAJOR + 1))
            PROJECT_VERSION="${NEW_MAJOR}.0.0"
            TAG="v${PROJECT_VERSION}"
            sed -i -E "s/const AppVersion = \".*\"/const AppVersion = \"${PROJECT_VERSION}\"/" internal/config/config.go
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add internal/config/config.go
            git commit -m "chore(release): bump version to $PROJECT_VERSION [skip ci]" || true
            git push origin main || true
          else
            TAG="v${PROJECT_VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              TAG="v${PROJECT_VERSION}-${{ github.run_number }}"
            fi
          fi

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o lan-video-player-linux-amd64 ./cmd/lan-video-player

          echo "Criando tag e release para: $TAG"
          gh release create "$TAG" \
            lan-video-player-linux-amd64 \
            --target main \
            --title "Release $TAG" \
            --generate-notes
