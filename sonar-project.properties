# ==============================================================================
# SonarQube Community Server Configuration
# ==============================================================================

sonar.projectKey=lan-video-player
sonar.projectName=lan-video-player
sonar.projectVersion=0.1.0

# Paths
sonar.sources=cmd,internal,web
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go

# Exclusions
sonar.exclusions=**/bin/**, **/dist/**, **/specs/**, **/.specify/**, **/.agents/**, **/web/static/LICENSE
sonar.coverage.exclusions=**/*_test.go, **/cmd/lan-video-player/main.go

# Language & Reports
sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8
